  <style>
    :root{

    }
    body{
      margin:0; font-family:Inter, "Segoe UI", Arial, sans-serif;
      background:linear-gradient(180deg,var(--bg),#03121a 120%);
      color:#e6eef3; padding:28px; display:flex; flex-direction:column; align-items:center;
    }
    .wrap{width:100%; max-width:980px;}
    header{ text-align:center; margin-bottom:18px;}
    header h1{margin:0;color:var(--accent);font-size:1.6rem;}
    header p{margin:6px 0 0; color:var(--muted);}

    .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0;}
    button{background:var(--accent);color:#02121a;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}
    .secondary{background:transparent;color:var(--accent);border:1px solid rgba(18,183,255,0.12)}
    .danger{background:#ff6b6b;color:#071021}

    .card{background:var(--card); padding:18px;border-radius:12px; box-shadow:0 8px 30px rgba(2,8,15,0.6); margin-bottom:14px;}
    h2.topic{margin:0 0 12px;color:#a8f0ff;font-size:1.05rem}
    .question{padding:12px;border-radius:10px;margin-bottom:10px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);}
    .qtext{color:var(--accent);margin:0 0 8px;font-weight:600}
    label.opt{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;background:#0d1420;margin:6px 0;border:1px solid rgba(255,255,255,0.03)}
    label.opt:hover{background:#121826}
    label.opt input{margin-right:10px}
    label.opt.correct{background:linear-gradient(90deg, rgba(0,255,153,0.06), rgba(0,255,153,0.03)); border:1px solid rgba(0,255,153,0.18);}
    label.opt.incorrect{background:linear-gradient(90deg, rgba(255,85,85,0.06), rgba(255,85,85,0.03)); border:1px solid rgba(255,85,85,0.18);}
    label.opt.show-correct{outline:2px dashed rgba(0,255,153,0.18)}
    #result{margin-top:12px;text-align:center;font-size:1.1rem;font-weight:700}
    .note{color:var(--muted);font-size:0.9rem;text-align:center;margin-top:8px}
    footer{margin-top:20px;color:var(--muted);font-size:0.85rem;text-align:center}
    @media (max-width:600px){
      .controls{flex-direction:column}
      button{width:100%}
    }
  </style>
</head>
