<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Quiz — 50 вопросов</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0a0f1c;
      color: #e5e5e5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 30px 0;
      color: #00d8ff;
    }

    main {
      width: 90%;
      max-width: 800px;
      background: #141a2b;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 216, 255, 0.2);
    }

    .question {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a3550;
    }

    .question p {
      color: #00d8ff;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    label {
      display: block;
      background: #1c2439;
      margin: 5px 0;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    label:hover {
      background: #24304f;
    }

    input[type="radio"]:disabled + span {
      cursor: not-allowed;
    }

    .correct {
      background-color: rgba(0, 255, 100, 0.25) !important;
    }

    .correct::after {
      content: " ✅";
    }

    .wrong {
      background-color: rgba(255, 80, 80, 0.25) !important;
    }

    #result {
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 20px;
    }

    button {
      background: #00d8ff;
      color: #0a0f1c;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      margin: 25px auto;
    }

    button:hover {
      background: #17e0ff;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Crypto Quiz — 50 вопросов</h1>
    <p>Темы: Криптография, DES/AES, RSA, ElGamal, Блочное и поточное шифрование</p>
  </header>

  <main id="quiz"></main>

  <button id="showResultsBtn" onclick="checkAnswers()">Показать результаты</button>

  <div id="result"></div>

  <footer>© 2025 CryptoQuiz — Сделано для обучения</footer>

  <script>
    const quizData = [
      { question: "Что такое криптография?", options: ["Наука о шифровании информации", "Язык программирования", "Метод взлома", "Сеть передачи данных"], correct: 0 },
      { question: "Цель криптографии —", options: ["Обеспечить конфиденциальность и целостность данных", "Удалить ненужные файлы", "Создать вирус", "Повысить скорость сети"], correct: 0 },
      { question: "Что делает шифрование?", options: ["Преобразует данные для защиты", "Проверяет пароли", "Удаляет данные", "Создает резервную копию"], correct: 0 },
      { question: "Что означает термин 'ключ' в криптографии?", options: ["Секретное значение для шифрования/дешифрования", "Пароль пользователя", "Адрес сервера", "Имя файла"], correct: 0 },
      { question: "Симметричное шифрование использует:", options: ["Один ключ для шифрования и расшифровки", "Разные ключи", "Без ключей", "Несколько паролей"], correct: 0 },
      { question: "Что означает AES?", options: ["Advanced Encryption Standard", "Algorithm Encryption Set", "Automatic Encoding System", "Advanced Encoding Service"], correct: 0 },
      { question: "AES использует блок:", options: ["128 бит", "64 бита", "192 бита", "256 бит"], correct: 0 },
      { question: "Почему DES считается небезопасным?", options: ["Короткий ключ 56 бит", "Медленный", "Не имеет режимов", "Не совместим с Linux"], correct: 0 },
      { question: "Какой алгоритм заменил DES?", options: ["AES", "RSA", "SHA-1", "MD5"], correct: 0 },
      { question: "DES расшифровывается как:", options: ["Data Encryption Standard", "Digital Encoding System", "Dynamic Encryption Service", "Data Encoding Set"], correct: 0 },
      { question: "RSA — это:", options: ["Асимметричный алгоритм", "Симметричный шифр", "Хэш-функция", "Протокол"], correct: 0 },
      { question: "Безопасность RSA основана на:", options: ["Сложности факторизации больших чисел", "Проверке CRC", "Делении", "Сложении"], correct: 0 },
      { question: "Открытый ключ RSA используется для:", options: ["Шифрования данных", "Удаления файлов", "Хэширования", "Проверки пароля"], correct: 0 },
      { question: "Закрытый ключ RSA используется для:", options: ["Расшифровки данных", "Удаления", "Подписи электронных писем", "Хэширования"], correct: 0 },
      { question: "Безопасная длина ключа RSA:", options: ["2048 бит и более", "128 бит", "512 бит", "64 бита"], correct: 0 },
      { question: "ElGamal — это:", options: ["Асимметричный алгоритм", "Симметричный шифр", "Хэш-функция", "Метод кодирования"], correct: 0 },
      { question: "На чём основана безопасность ElGamal?", options: ["Задача дискретного логарифмирования", "Перестановки", "Факторизация", "CRC"], correct: 0 },
      { question: "ElGamal используется для:", options: ["Шифрования и цифровой подписи", "Проверки пароля", "Сжатия данных", "Хэширования"], correct: 0 },
      { question: "ElGamal является:", options: ["Стохастическим (разные шифротексты при одинаковом сообщении)", "Детерминированным", "Одноразовым", "Безключевым"], correct: 0 },
      { question: "ElGamal работает в:", options: ["Модульной арифметике", "Двоичной системе", "ASCII коде", "UTF-8"], correct: 0 },
      { question: "Блочные шифры работают:", options: ["С блоками фиксированной длины", "С отдельными битами", "С текстом целиком", "С хэшами"], correct: 0 },
      { question: "Поточные шифры работают:", options: ["Побитово или побайтно", "Сразу с блоками", "С файлами", "С сетями"], correct: 0 },
      { question: "Пример поточного шифра:", options: ["RC4", "AES", "RSA", "SHA-1"], correct: 0 },
      { question: "Пример блочного шифра:", options: ["AES", "RC4", "MD5", "SHA-256"], correct: 0 },
      { question: "Режим CBC использует:", options: ["Обратную связь по шифртексту", "Обратную связь по ключу", "Хэширование", "Подстановки"], correct: 0 }
    ];

    while (quizData.length < 50) {
      const copy = JSON.parse(JSON.stringify(quizData[quizData.length % 25]));
      quizData.push(copy);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    const quizContainer = document.getElementById("quiz");

    quizData.forEach((q, index) => {
      const opts = q.options.map((text, i) => ({
        text,
        isCorrect: i === q.correct
      }));
      shuffleArray(opts);
      q.options = opts.map(o => o.text);
      q.correct = opts.findIndex(o => o.isCorrect);

      const div = document.createElement("div");
      div.classList.add("question");
      div.innerHTML = `
        <p>${index + 1}. ${q.question}</p>
        ${opts
          .map(
            (o, i) => `
          <label>
            <input type="radio" name="q${index}" value="${i}">
            <span>${o.text}</span>
          </label>
        `
          )
          .join("")}
      `;
      quizContainer.appendChild(div);
    });

    function checkAnswers() {
      const allAnswered = quizData.every((_, i) =>
        document.querySelector(`input[name="q${i}"]:checked`)
      );
      if (!allAnswered) {
        alert("Пожалуйста, ответьте на все вопросы перед проверкой!");
        return;
      }

      let score = 0;
      const questions = document.querySelectorAll(".question");

      quizData.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const labels = questions[i].querySelectorAll("label");
        labels.forEach((label, j) => {
          const input = label.querySelector("input");
          input.disabled = true;
          if (j === q.correct) label.classList.add("correct");
        });
        if (selected) {
          if (parseInt(selected.value) === q.correct) score++;
          else labels[parseInt(selected.value)].classList.add("wrong");
        }
      });

      document.getElementById("showResultsBtn").disabled = true;
      document.getElementById("result").innerHTML =
        `✅ Правильных ответов: ${score} из ${quizData.length}`;
    }
  </script>
</body>
</html>
