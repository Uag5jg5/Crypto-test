<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест по Криптографии</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0a0f1c;
      color: #e5e5e5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 30px 0;
      color: #00d8ff;
    }

    main {
      width: 90%;
      max-width: 700px;
      background: #141a2b;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 216, 255, 0.2);
    }

    .question {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #2a3550;
    }

    .question p {
      font-size: 1.1rem;
      color: #00d8ff;
    }

    label {
      display: block;
      margin: 8px 0;
      cursor: pointer;
      background: #1c2439;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    label:hover {
      background: #24304f;
    }

    button {
      background: #00d8ff;
      color: #0a0f1c;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      margin: 20px auto;
    }

    button:hover {
      background: #17e0ff;
    }

    #result {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🧠 Тест по Криптографии</h1>
    <p>Проверь свои знания о шифровании, AES и хэш-функциях!</p>
  </header>

  <main id="quiz"></main>

  <button onclick="checkAnswers()">Проверить ответы</button>
  <div id="result"></div>

  <footer>© 2025 CryptoQuiz — обучение шифрованию</footer>

  <script>
    const quizData = [
      {
        question: "1️⃣ Какой алгоритм относится к симметричному блочному шифрованию?",
        options: ["RSA", "AES", "Diffie-Hellman", "ElGamal"],
        correct: 1
      },
      {
        question: "2️⃣ Какой размер блока использует AES?",
        options: ["64 бита", "128 бит", "192 бита", "256 бит"],
        correct: 1
      },
      {
        question: "3️⃣ Какой режим работы блочного шифра обеспечивает обратную связь по шифртексту?",
        options: ["ECB", "CBC", "CTR", "OFB"],
        correct: 1
      },
      {
        question: "4️⃣ Какой алгоритм используется для обмена ключами?",
        options: ["AES", "RSA", "Diffie-Hellman", "SHA-256"],
        correct: 2
      },
      {
        question: "5️⃣ Что делает хэш-функция?",
        options: [
          "Шифрует данные с возможностью расшифровки",
          "Преобразует данные в фиксированную длину без обратного преобразования",
          "Создаёт пару ключей",
          "Передаёт ключи по открытому каналу"
        ],
        correct: 1
      }
    ];

    const quizContainer = document.getElementById("quiz");

    quizData.forEach((q, index) => {
      const div = document.createElement("div");
      div.classList.add("question");
      div.innerHTML = `
        <p>${q.question}</p>
        ${q.options
          .map(
            (opt, i) => `
          <label>
            <input type="radio" name="q${index}" value="${i}"> ${opt}
          </label>`
          )
          .join("")}
      `;
      quizContainer.appendChild(div);
    });

    function checkAnswers() {
      let score = 0;
      quizData.forEach((q, index) => {
        const answer = document.querySelector(`input[name="q${index}"]:checked`);
        if (answer && parseInt(answer.value) === q.correct) {
          score++;
        }
      });
      const result = document.getElementById("result");
      result.innerHTML = `✅ Вы ответили правильно на ${score} из ${quizData.length} вопросов.`;
      result.style.color = score >= 3 ? "#00ff99" : "#ff5555";
    }
  </script>
</body>
</html>
